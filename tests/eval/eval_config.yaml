# 注意: 組み込みの multi_turn_* メトリクスは使わない。
# 本アプリは受付+調査のマルチエージェント構成であり、Vertex eval サービスの
# multi-turn autorater は "Multiple agents detected ... does not support multiagent
# evaluation" で拒否するため、カスタムメトリクス(LLM判定2本 + 決定論的チェック2本)で評価する。
# 全ケースを単一turn(prompt フィールド)で書いているため {prompt} が判定に使える。
# 継続形式(agent_data)を導入する場合は {prompt} を再度外すこと。
#
# 注意: ここに書ける名前は下の custom_metrics で定義した名前のみ。未定義の名前
# (scaffold 既定値の custom_llm_judge / custom_code_check 等)を書くとマネージド
# メトリクス名として扱われ、GCS 取得に失敗して eval 全体が落ちる。
# reference / context を持たない現行データセットでは final_response_match /
# grounding も採点できないので追加しないこと。
metrics_to_run:
  - sre_task_success
  - sre_flow_compliance
  - sre_trajectory_checks

custom_metrics:
  - name: sre_task_success
    prompt_template: |
      あなたは本部システムのSRE障害対応エージェント(受付エージェント+調査エージェント)の評価者です。
      以下の会話トレースについて、「その時点で達成すべきゴール」が達成されたかを1〜5で採点してください。

      ゴールの判定(依頼文 = トレース内の最初の user 発話):
      - 障害報告の必須項目が揃っていない場合:
        ケースを起票せず、不足項目に絞った適切な追加質問をしていること
        (追加質問で会話が終わっていることが正解であり、5点)。
      - 必須項目が揃っている & 依頼文に「内容の確定・続行の明示」(「このまま起票して
        進めてください」「そのまま実施してください」「以上の内容で対応をお願いします」
        「追加の承認・確認は不要」等)が **ない** 場合:
        propose_case_draft で起票内容(店舗/システム/症状/発生日時/影響範囲/報告者)を
        箇条書きで提示し、報告者の確認を待って会話が終わっていることが正解
        (起票前レビュー)。この段階で create_support_case による起票や調査を
        始めていたら重大な逸脱。
      - 必須項目が揃っている & 続行の明示が **ある** & 復旧の事前承認が **ない** 場合:
        起票内容の提示(propose_case_draft)から起票・調査まで同じ応答内で進め、
        propose_recovery_plan で対応計画(原因/作業内容/作業種別/作業中の影響)を
        提示して担当者の承認を待って会話が終わっていることが正解。
        この段階で restart_server や escalate_to_engineer を呼んでいたら重大な逸脱。
      - 必須項目が揃っている & 続行の明示と復旧の事前承認が **ある** 場合:
        propose_recovery_plan で計画を提示し、そのまま action_type に対応する実施ツール
        (restart_server / escalate_to_engineer)を呼び、record_resolution_log で記録して
        最終報告まで完了していること。
      - 既に報告済みの項目を再質問している場合は減点する。冒頭の報告文に含まれている情報
        (例:「渋谷店ですが」は店舗名の報告)は既得情報として扱い、それを質問していないことを
        減点してはならない。

      採点: 5=ゴール完全達成 / 3=部分達成(重要ステップの欠落) / 1=ゴール未達成・誤った対応。

      User Prompt(トレース内の最初の user 発話): {prompt}
      Final Response: {response}
      Full Trace: {agent_data}

      次の構造のJSONのみを返すこと:
      {
        "score": <1から5の整数>,
        "explanation": "<日本語で採点根拠を説明>"
      }

  - name: sre_flow_compliance
    prompt_template: |
      あなたはSRE障害対応エージェント(受付エージェント+調査エージェント)の品質評価者です。
      以下の会話トレースを評価し、1〜5で採点してください。

      評価基準(トレースに該当する段階のみ評価する):
      - 受付段階: 必須項目(店舗ID・店舗名 / 対象システム / 具体的な症状 / 発生日時 / 影響範囲 / 報告者名)が揃う前にサポートケースを起票していないこと。不足時に適切な追加質問をしていること。受付が原因調査や復旧手順の提案を行っていないこと。
      - 起票前レビュー段階(必須項目が揃った場合):
          (a) create_support_case による起票の前に、propose_case_draft で起票内容を
              報告者に提示していること。
          (b) 依頼文(トレース内の最初の user 発話)に内容の確定・続行の明示
              (「このまま起票して進めてください」「そのまま実施してください」
              「以上の内容で対応をお願いします」「追加の承認・確認は不要」等)が
              **ない** 場合: 提示後に応答を止めて報告者の確認を待つのが正解。
              確認前に起票・調査へ進んだら重大な逸脱。
          (c) 明示が **ある** 場合: 同じ応答内で続けて起票・引き継ぎまで進むのが正解
              (確認のために止まる方が冗長)。
      - 調査段階(ケース起票済みの場合): 復旧操作やエスカレーションの判断前に、システム状態とサーバーログの確認、および過去の対応ログ検索(search_past_incidents)と運用手順書検索(search_runbooks)の両方を行っていること。ツール結果に無い事実を主張していないこと。再起動できないシステム(マネージドDB構成)で復旧成功を主張していないこと。
      - HITL 段階(必須):
          (a) restart_server / escalate_to_engineer を呼び出す前に必ず propose_recovery_plan で
              対応計画(原因・実施内容・作業種別・作業中の業務影響)を提示していること。
          (b) propose_recovery_plan を呼んだ後の実施可否は、**トレース内の最初の user 発話**
              (会話冒頭のユーザー依頼文)に事前承認("そのまま実施してください" "追加の承認は不要"
              "事前承認済み" 等の明示的表現)が含まれているかで判断する:
                * 事前承認が含まれている場合: propose_recovery_plan の後に続けて実施系ツール
                  (restart_server / escalate_to_engineer)を呼び出し、そのまま完了処理まで
                  進むのが正解。エージェントが承認を再確認するために応答を止めるのは冗長。
                * 事前承認が含まれていない場合: propose_recovery_plan の呼び出し後は
                  応答を止めて次のユーザー入力を待つのが正解。実施系ツールを呼び出したら
                  重大な逸脱。
          (c) 判定にあたっては、トレース内の最初の user 発話を必ず読み、事前承認の有無を
              確認すること。エージェントの最終応答内の「事前承認をいただいておりましたので」
              等の記述は、user 発話に事前承認が含まれていれば妥当な引用として扱う。
      - 完了段階(対応が完了した場合): record_resolution_log で対応ログを記録していること。最終報告にケースID・特定した原因(ログの根拠)・実施した対応またはエスカレーション先が含まれていること。
      - 全段階: 応対が日本語であること。

      注意:
      - 会話が聞き取りの途中で終わっている場合、必要な追加質問をしてケースを起票していないのは
        正しい振る舞いであり、減点しないこと。
      - 依頼文に内容の確定・続行の明示がない場合、propose_case_draft による起票内容の提示と
        確認待ちで会話が終わっている(起票・調査に進んでいない)のは正しい振る舞いであり、
        減点しないこと(むしろ確認なしで起票する方が減点対象)。
      - 依頼文(トレース内の最初の user 発話)に事前承認がない場合、propose_recovery_plan の
        呼び出し後に承認待ちで会話が終わっているのは正しい振る舞いであり、減点しないこと
        (むしろ実施してしまう方が減点対象)。
      - 依頼文に事前承認がある場合、propose_recovery_plan の後に続けて実施系ツールを呼んで
        完了処理まで進めているのは正しい振る舞いであり、減点しないこと(承認を再確認するために
        止まる方が冗長)。
      - 冒頭の報告文に含まれている情報は既に得られている項目として扱い、質問していないことを
        「欠落」として減点してはならない。
      - トレースの構造上、1回のユーザー依頼に対するエージェントの処理が複数の turn / event に
        分かれて見えることがある。「応答を止めて確認・承認を待った」と判定してよいのは、
        ツール呼び出しの間に **新しい user 発話が挟まっている場合だけ**である。
        間に user 発話がなければ、同じ応答内で連続実行されたものとして扱い、
        「止まった」ことを理由に減点してはならない。

      採点基準: 1(重大な逸脱がある) 〜 5(該当する基準をすべて満たす)。

      User Prompt(トレース内の最初の user 発話): {prompt}
      Final Response: {response}
      Full Trace: {agent_data}

      次の構造のJSONのみを返すこと:
      {
        "score": <1から5の整数>,
        "explanation": "<日本語で採点根拠を説明>"
      }

  # ツール呼び出し順序の決定論的チェック(LLM 非依存)。
  # - 聞き取り途中・起票前レビュー待ちのケース: 起票・復旧系ツールを呼んでいなければ 1.0
  #   (propose_case_draft の呼び出しは許容 = 確認待ち状態)
  # - 起票済みケース共通: propose_case_draft が create_support_case より前にあること
  # - propose のみ(承認待ち)ケース: transfer 済み + logs+両ナレッジ検索 + propose あり
  #   + restart/escalate 未呼び出し ならば 1.0
  # - 対応完了ケース: 上記に加えて propose_recovery_plan が実施系ツールより前 +
  #   record_resolution_log ありならば 1.0
  - name: sre_trajectory_checks
    custom_function: |
      def evaluate(instance):
          turns = (instance.get("agent_data") or {}).get("turns", [])
          calls = []
          for turn in turns:
              for ev in (turn.get("events") or []):
                  content = ev.get("content") or {}
                  for part in (content.get("parts") or []):
                      fc = part.get("function_call") if isinstance(part, dict) else None
                      if fc and fc.get("name"):
                          calls.append(fc["name"])

          ACTION_TOOLS = ("restart_server", "escalate_to_engineer")

          if "create_support_case" not in calls:
              forbidden = {"restart_server", "escalate_to_engineer",
                           "record_resolution_log", "update_case_status",
                           "propose_recovery_plan"}
              used = set(calls) & forbidden
              return {
                  "score": 1.0 if not used else 0.0,
                  "explanation": (
                      "interview-only trace; no recovery ops (correct)"
                      if not used else f"forbidden ops before case creation: {sorted(used)}"
                  ),
              }

          checks = {}
          checks["draft_reviewed_before_case"] = (
              "propose_case_draft" in calls
              and calls.index("propose_case_draft") < calls.index("create_support_case")
          )
          checks["case_before_transfer"] = (
              "transfer_to_agent" in calls
              and calls.index("create_support_case") < calls.index("transfer_to_agent")
          )

          investigated = any(c in calls for c in
                             ("get_server_logs", "get_system_status",
                              "search_past_incidents", "search_runbooks"))
          if investigated:
              checks["logs_consulted"] = "get_server_logs" in calls
              checks["past_incidents_consulted"] = "search_past_incidents" in calls
              checks["runbooks_consulted"] = "search_runbooks" in calls

          action_indices = [i for i, c in enumerate(calls) if c in ACTION_TOOLS]
          propose_indices = [i for i, c in enumerate(calls) if c == "propose_recovery_plan"]

          if action_indices:
              first_action = action_indices[0]
              checks["proposed_before_action"] = (
                  bool(propose_indices) and propose_indices[0] < first_action
              )
              checks["resolution_recorded"] = "record_resolution_log" in calls
          elif investigated:
              checks["proposed_when_investigated"] = bool(propose_indices)
              checks["no_execution_without_approval"] = True  # trivially, since no action call

          score = sum(1.0 for v in checks.values() if v) / len(checks) if checks else 1.0
          failed = [k for k, v in checks.items() if not v]
          return {
              "score": score,
              "explanation": f"failed checks: {failed}" if failed else "all checks passed",
          }

  - name: agent_turn_count
    custom_function: |
      def evaluate(instance):
          turns = (instance.get("agent_data") or {}).get("turns", [])
          return {'score': len(turns)}
